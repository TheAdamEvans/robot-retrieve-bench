[project]
name = "alloy-train"
version = "0.1.0"
description = "Learning and evaluation: benchmark runner, pooling, metrics, reports, Stage C training."
requires-python = ">=3.13,<3.14"
dependencies = [
    "alloy-server",
    "alloy-index",
]

[tool.uv.sources]
alloy-server = { workspace = true }
alloy-index = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alloy_train"]
