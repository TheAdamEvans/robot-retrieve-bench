[project]
name = "alloy-server"
version = "0.1.0"
description = "Search server: contracts, instrumented readers, pipeline runner, verification."
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=2.1",
    "pyarrow>=18",
    "zstandard>=0.23",
    "protobuf>=5.28",
    "pillow>=11",
    "torch>=2.6",
    "transformers>=4.49",
    "sentencepiece>=0.2",
    "openai>=1.60",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alloy_server"]
