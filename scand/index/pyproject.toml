[project]
name = "alloy-index"
version = "0.1.0"
description = "Indexing: sources -> stages (intake, providers, embeddings, optional labelling views) -> bundle sink."
requires-python = ">=3.13,<3.14"
dependencies = [
    "alloy-server",
    "rosbags==0.11.5",
    "mcap>=1.2",
    "av==18.1.0",
    "torchvision>=0.29",
    "matplotlib>=3.9",
    "scipy>=1.14",
    "grpcio-tools>=1.68",
]

[project.scripts]
scandq = "alloy_index.scandq.cli:main"
alloy-index = "alloy_index.cli:main"

[tool.uv.sources]
alloy-server = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alloy_index"]
