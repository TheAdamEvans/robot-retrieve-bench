[project]
name = "scand-retrieval-benchmark"
version = "0.1.0"
description = "Reproducible experiments for temporal and semantic retrieval over SCAND robot recordings."
requires-python = ">=3.13,<3.14"
dependencies = ["alloy-server", "alloy-index", "alloy-train"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["server", "index", "trainer"]

[tool.uv.sources]
alloy-server = { workspace = true }
alloy-index = { workspace = true }
alloy-train = { workspace = true }

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["server/tests", "index/tests", "trainer/tests"]
markers = [
    "moduleeval: a module's self-contained eval suite (evals/*/confeval.py)",
    "requires_bundle: needs the built dev bundle",
    "requires_llm: calls a paid model API (runs only with ALLOY_EVALS_LLM=1)",
]
